name: Build NeKo VPN APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tạo GitHub Release với tag này (để trống nếu chỉ lấy APK trong Artifacts)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: neko-vpn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (Xray core)
    runs-on: ubuntu-latest

    env:
      # AndroidLibXrayLite v26.8.20: Co reconcileBrowserDialer, ho tro VLESS port 80 (truoc v26.9.9)
      ANDROID_LIB_XRAY_TAG: v26.8.20
      NDK_VERSION: 30.0.16248370
      ABI_FILTERS: "arm64-v8a;armeabi-v7a"

      # Tùy chọn: thêm 4 secret này để dùng keystore cố định.
      # Nếu không thêm, workflow tự tạo keystore và lưu trong Actions cache.
      KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}

    steps:
      - name: Checkout source + submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build hev-socks5-tunnel (native TUN, all ABIs)
        run: bash compile-hevtun.sh

      - name: Copy native TUN libraries
        run: cp -r libs V2rayNG/app

      - name: Download libv2ray.aar (Xray core)
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.ANDROID_LIB_XRAY_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore fallback signing key
        id: fallback-key
        uses: actions/cache/restore@v6
        with:
          path: .signing
          key: neko-fallback-signing-v1

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > .signing/neko.jks
            {
              echo "STORE_PASS=$KEYSTORE_PASSWORD"
              echo "KEY_PASS=$KEY_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
          elif [ -f .signing/neko.jks ] && [ -f .signing/pass.txt ]; then
            echo "Using cached fallback keystore."
            PASS="$(cat .signing/pass.txt)"
            {
              echo "STORE_PASS=$PASS"
              echo "KEY_PASS=$PASS"
              echo "KEY_ALIAS=neko"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secret found: generating a fallback keystore."
            PASS="$(openssl rand -hex 24)"
            keytool -genkeypair \
              -keystore .signing/neko.jks \
              -alias neko \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=NeKo VPN, OU=NeKo VPN, O=NeKo VPN, L=Hanoi, ST=Hanoi, C=VN"
            printf '%s' "$PASS" > .signing/pass.txt
            {
              echo "STORE_PASS=$PASS"
              echo "KEY_PASS=$PASS"
              echo "KEY_ALIAS=neko"
            } >> "$GITHUB_ENV"
          fi

      - name: Save fallback signing key
        if: env.KEYSTORE_BASE64 == '' && steps.fallback-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .signing
          key: neko-fallback-signing-v1

      - name: Build signed release APKs
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreRelease \
            -PABI_FILTERS="$ABI_FILTERS" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.signing/neko.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --console=plain

      - name: Verify APKs
        run: |
          set -e
          APK_DIR="V2rayNG/app/build/outputs/apk/playstore/release"
          ls -lh "$APK_DIR"/*.apk
          for apk in "$APK_DIR"/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Build summary
        run: |
          {
            echo "### NeKo VPN - APK đã build"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for apk in V2rayNG/app/build/outputs/apk/playstore/release/*.apk; do
              echo "| \`$(basename "$apk")\` | $(du -h "$apk" | cut -f1) |"
            done
            echo ""
            echo "Tải APK ở mục **Artifacts** của workflow run này."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NeKoVPN-${{ github.run_number }}
          path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: NeKoVPN-*
          path: apk
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || 'v2.4.2' }}
          name: NeKo VPN ${{ inputs.release_tag || 'v2.4.2' }}
          files: apk/*.apk
          prerelease: false
          generate_release_notes: true
